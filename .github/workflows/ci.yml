name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# Push mới lên cùng một nhánh sẽ huỷ lần chạy trước, khỏi xếp hàng vô ích.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Không ghim version ở đây: action đọc trường `packageManager` trong
      # package.json, nên CI và máy dev không thể lệch nhau.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache build của Next.js — không có nó thì mọi lần build đều là build lạnh.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      # Cố tình build với biến RỖNG, không phải bỏ trống biến.
      #
      # Đây là cách tái hiện đúng môi trường Docker và docker-compose: `ARG` và
      # `${VAR:-}` khi không có giá trị sẽ truyền vào chuỗi rỗng chứ không phải
      # `undefined`. Bỏ trống ở đây thì CI xanh nhưng Docker vẫn chết — đúng
      # tình huống đã xảy ra một lần rồi.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ""
          NEXT_PUBLIC_ADSENSE_CLIENT: ""

      # Lỗi SEO hỏng âm thầm: site chạy đẹp nhưng Google không vào được. Rẻ
      # nhất là chặn ngay ở CI. Đã từng có public/robots.txt chứa `Disallow: /`
      # che mất route src/app/robots.ts.
      - name: Kiểm tra robots.txt không chặn bot
        run: |
          node .next/standalone/server.js &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break
            sleep 1
          done

          echo "── robots.txt ──"
          curl -fsS http://127.0.0.1:3000/robots.txt | tee /tmp/robots.txt

          if grep -qi '^Disallow: /$' /tmp/robots.txt; then
            echo "::error::robots.txt đang chặn toàn bộ site. Kiểm tra file tĩnh trong public/ có đè lên src/app/robots.ts không."
            exit 1
          fi

          echo "── sitemap.xml ──"
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -c '<loc>'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Dockerfile hỏng chỉ lộ ra lúc deploy nếu CI không tự build thử.
      # `load: true` để bước sau chạy được image vừa build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: congcu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build xong KHÔNG có nghĩa là chạy được.
      #
      # Đã từng gặp: image build sạch nhưng container vừa lên là chết với
      # MODULE_NOT_FOUND, do Next.js truy vết thiếu file vào bản standalone.
      # Loại lỗi này chỉ lộ ra khi chạy thật, nên bước dưới đây là bắt buộc.
      - name: Chạy thử container
        run: |
          docker run -d --name congcu-ci -p 3000:3000 congcu:ci

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && ok=1 && break
            sleep 2
          done

          if [ "${ok:-0}" != "1" ]; then
            echo "::error::Container không phục vụ được sau 60 giây."
            docker logs congcu-ci
            exit 1
          fi

          echo "✓ Container phục vụ bình thường"
          curl -fsS http://127.0.0.1:3000/robots.txt
          docker rm -f congcu-ci
